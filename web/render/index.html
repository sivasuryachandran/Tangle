<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tangle render</title>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
</head>
<body style="margin:0;background:#000">
<script type="module">
import { renderPanels } from './panels.js';

import { renderStreet } from './streetsim.js';
import { renderReference, renderMask } from './reference.js';
import { renderIdPass } from './idpass.js';
import { StreetVideo, DeliveryVideo } from './video.js';
import { setLibrary } from './scene_builder.js';

// Share object sizes with the checker via schemas/object_library.json.
try { setLibrary(await (await fetch('/schemas/object_library.json')).json()); }
catch (e) { console.warn('object_library.json not loaded, using built-in sizes', e); }

// Entry points called by headless/render.mjs.
window.tangleRenderPanels = (params, tMs) =>
  renderPanels(params.scene, params.assumed, tMs / 1000);

// Panels (ASSUMED spec) -> street sim (TRUE spec). Returns { 'L.png', 'R.png', 'street.png' } dataURLs.
window.tangleRenderFrame = async (params, tMs) => {
  const panels = renderPanels(params.scene, params.assumed, tMs / 1000);
  const street = await renderStreet(params.true, panels);
  const reference = renderReference(params.scene, params.true, tMs / 1000);
  const files = {};
  for (const [name, url] of Object.entries(panels)) files[`${name}.png`] = url; // any number of panels
  Object.assign(files, { 'street.png': street, 'reference.png': reference });
  files['mask_ref.png'] = renderMask(params.scene, params.true, tMs / 1000);
  if (params.anchors) {
    files['idpass_street.png'] = renderIdPass(params.anchors, params.assumed, params.true, tMs / 1000);
  }
  return files;
};
// Video sessions: open once, then request frames one by one (JPEG dataURLs).
let video = null;
window.tangleVideoOpen = (params, kind, opts) => {
  video = kind === 'delivery' ? new DeliveryVideo(params, opts) : new StreetVideo(params, opts);
  return { w: video.w, h: video.h, right: video.rightVector ? video.rightVector() : null };
};
window.tangleVideoFrame = (t, eyeOffset) => video.frame(t, eyeOffset);
window.tangleReady = true;
</script>
</body>
</html>

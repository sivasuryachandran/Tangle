<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tangle hero</title>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
<style>
  :root { --bg: #04060b; --text: #e8eef7; --muted: #9db0c8; --accent: #ff8a3d; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #poster { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .8s ease; }
  #poster.gone { opacity: 0; pointer-events: none; }
  #caption { position: fixed; left: 16px; bottom: 14px; max-width: min(52%, calc(100% - 32px)); color: var(--muted);
    font-size: 12px; letter-spacing: .2px; text-shadow: 0 1px 8px #000; }
  .bar { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  #bottom { position: fixed; left: 14px; right: 14px; bottom: 44px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #bottom label { display: flex; align-items: center; gap: 8px; color: var(--muted); background: rgba(14, 20, 30, .72); border: 1px solid #2a3a50; border-radius: 10px; padding: 6px 10px; backdrop-filter: blur(6px); }
  #bottom output, #bottom .val { color: var(--text); min-width: 4.2em; display: inline-block; font-variant-numeric: tabular-nums; }
  #hint { position: fixed; right: 16px; bottom: 14px; max-width: 42%; text-align: right; color: var(--muted); font-size: 12px; text-shadow: 0 1px 8px #000; }
  button { font: inherit; color: var(--text); background: rgba(14, 20, 30, .72); border: 1px solid #2a3a50;
    border-radius: 10px; padding: 8px 12px; cursor: pointer; backdrop-filter: blur(6px); }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #1b1006; font-weight: 600; }
  #dev { position: fixed; top: 14px; left: 14px; width: 280px; max-height: calc(100% - 28px); overflow: auto;
    padding: 10px 12px; background: rgba(8, 12, 20, .86); border: 1px solid #2a3a50; border-radius: 10px; font-size: 12px; }
  #dev label { display: grid; grid-template-columns: 1fr 90px 40px; gap: 6px; align-items: center; margin: 4px 0; color: var(--muted); }
  #dev output { color: var(--text); text-align: right; }
  #dev button { width: 100%; margin-top: 8px; }
  input[type=range] { accent-color: var(--accent); width: 90px; }
</style>
</head>
<body>
<img id="poster" src="./hero_poster.jpg" alt="">
<div id="stage"></div>
<div class="bar">
  <button id="btnMode" title="Switch between the photo scene and the full 3D street">3D street view</button>
  <button id="btnOrbit" hidden title="Free orbit around the corner">Orbit</button>
  <button id="btnFlat" hidden title="Fly the camera up from the same spot so the billboard faces the camera and the whole ad shows">Fly up: flat view</button>
  <button id="btnZoom" title="Turn the camera push and scroll-zoom on or off (?zoom=0 starts with it off)">Zoom: on</button>
  <button id="btnReplay" title="Replay the camera drift">Replay</button>
  <button id="btnEye" title="Move to the true eye position">Stand at eye</button>
</div>
<div id="bottom">
  <button id="btnPlay">Pause</button>
  <label>Time <input id="time" type="range" min="0" max="10" step="0.01" value="0"><span class="val" id="timeVal">0.00 s</span></label>
  <label id="walkWrap" hidden>Walk-by <input id="walk" type="range" min="-2" max="2" step="0.01" value="0"><span class="val" id="walkVal">0.00 m</span></label>
</div>
<div id="hint"></div>
<div id="caption">Loading…</div>
<script type="module" src="./hero.js"></script>
</body>
</html>

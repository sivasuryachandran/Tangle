[project]
name = "tangle"
version = "0.1.0"
description = "3D billboard ads that pass the street-view test"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "scikit-image",
  "jsonschema",
  "jsonpatch",
  "google-genai>=2.3.0",
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
